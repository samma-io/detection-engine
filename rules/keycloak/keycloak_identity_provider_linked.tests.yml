# Events modelled on Keycloak 26 org.keycloak.events lines after k8s-log-router (parse: keycloak), with names and addresses replaced.
- name: idp link fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: web-app
    userId: example-user-id-alice
    username: alice
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: IDENTITY_PROVIDER_LINK_ACCOUNT
    identity_provider: github
    search_text: type="IDENTITY_PROVIDER_LINK_ACCOUNT", realmName="example", clientId="web-app"
- name: federated identity link fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: account-console
    userId: example-user-id-alice
    username: alice
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: FEDERATED_IDENTITY_LINK
    identity_provider: google
    search_text: type="FEDERATED_IDENTITY_LINK", realmName="example", clientId="account-console"
- name: idp login does not fire
  expected: false
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: web-app
    userId: example-user-id-alice
    username: alice
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: IDENTITY_PROVIDER_LOGIN
    identity_provider: github
    search_text: type="IDENTITY_PROVIDER_LOGIN", realmName="example", clientId="web-app"
