# Events modelled on Keycloak 26 org.keycloak.events lines after k8s-log-router (parse: keycloak), with names and addresses replaced.
- name: bad client secret fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: backend-svc
    ipAddress: 198.51.100.7
    level: WARN
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: CLIENT_LOGIN_ERROR
    error: invalid_client_credentials
    search_text: type="CLIENT_LOGIN_ERROR", realmName="example", clientId="backend-svc", error="invalid_client_credentials"
- name: unknown client fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: nope
    ipAddress: 198.51.100.7
    level: WARN
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: CLIENT_LOGIN_ERROR
    error: invalid_client
    search_text: type="CLIENT_LOGIN_ERROR", realmName="example", clientId="nope", error="invalid_client"
- name: successful client login does not fire
  expected: false
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: backend-svc
    ipAddress: 198.51.100.7
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: CLIENT_LOGIN
    search_text: type="CLIENT_LOGIN", realmName="example", clientId="backend-svc"
