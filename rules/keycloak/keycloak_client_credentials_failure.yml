title: Keycloak Client Credentials Failure
id: a6b62eda-fccc-4643-8bb6-d52cbc8b11ae
status: experimental
description: A service client failed to authenticate with its client secret or signed JWT. Either a deployment carries a stale
  secret, or someone is trying secrets against a confidential client.
author: samma-io
level: medium
tags:
- attack.credential_access
- attack.t1110
- attack.t1528
logsource:
  product: keycloak
  service: events
detection:
  selection:
    type: CLIENT_LOGIN_ERROR
    error:
    - invalid_client_credentials
    - unauthorized_client
    - invalid_client
  condition: selection
falsepositives:
- A service deployed with an old secret after rotation; it fails on every token request until fixed.
