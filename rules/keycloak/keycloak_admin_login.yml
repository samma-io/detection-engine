title: Keycloak Admin Login
id: 300ce7bd-e100-4215-a748-95af7b176d3d
status: experimental
description: A user logged in to the Keycloak admin console, or got a token through admin-cli. Expected only from administrators
  at known addresses; an admin-cli login from a new ipAddress is how a stolen admin password is used. Needs successful events
  logged (KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL=info).
author: samma-io
level: medium
tags:
- attack.privilege_escalation
- attack.t1078
logsource:
  product: keycloak
  service: events
detection:
  selection:
    type: LOGIN
    clientId:
    - security-admin-console
    - admin-cli
  condition: selection
falsepositives:
- Routine administration; tune by username and ipAddress if logins are frequent.
