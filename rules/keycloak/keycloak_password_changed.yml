title: Keycloak Password Changed or Reset
id: 839e1dc4-6f5b-4ac3-8362-845e844292fc
status: experimental
description: A user changed or reset their password. Expected now and then; after a run of login failures for the same user,
  or from an unusual ipAddress, it can be an account takeover being made permanent.
author: samma-io
level: low
tags:
- attack.persistence
- attack.t1098
logsource:
  product: keycloak
  service: events
detection:
  selection_type:
    type:
    - UPDATE_PASSWORD
    - RESET_PASSWORD
  selection_credential:
    type: UPDATE_CREDENTIAL
    credential_type: password
  condition: 1 of selection_*
falsepositives:
- Routine password changes.
