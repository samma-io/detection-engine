# Events modelled on Keycloak 26 org.keycloak.events lines after k8s-log-router (parse: keycloak), with names and addresses replaced.
- name: bad password on an app client fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: web-app
    userId: example-user-id-alice
    username: alice
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: WARN
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: LOGIN_ERROR
    error: invalid_user_credentials
    search_text: type="LOGIN_ERROR", realmName="example", clientId="web-app", error="invalid_user_credentials"
- name: unknown username fires
