# Events modelled on Keycloak 26 org.keycloak.events lines after k8s-log-router (parse: keycloak), with names and addresses replaced.
- name: admin console login fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: master
    clientId: security-admin-console
    userId: 5f3c2b1a-0000-4000-8000-000000000001
    username: admin
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: LOGIN
    search_text: type="LOGIN", realmName="master", clientId="security-admin-console"
- name: admin-cli password grant fires
  expected: true
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: master
    clientId: admin-cli
    userId: 5f3c2b1a-0000-4000-8000-000000000001
    username: admin
    ipAddress: 198.51.100.7
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: LOGIN
    grant_type: password
    search_text: type="LOGIN", realmName="master", clientId="admin-cli"
- name: app login does not fire
  expected: false
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: web-app
    userId: 5f3c2b1a-0000-4000-8000-000000000001
    username: alice
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: INFO
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: LOGIN
    search_text: type="LOGIN", realmName="example", clientId="web-app"
- name: admin console failure does not fire
  expected: false
  event:
    source: keycloak
    feed: k8s
    realmId: example-realm-id
    realmName: example
    clientId: security-admin-console
    userId: 5f3c2b1a-0000-4000-8000-000000000001
    username: alice
    ipAddress: 198.51.100.7
    auth_method: openid-connect
    level: WARN
    event_time: '2026-11-25T16:20:01.123Z'
    k8s:
      namespace: keycloak
      pod: keycloak-0
      container: keycloak
      node: node1
    type: LOGIN_ERROR
    error: invalid_user_credentials
    search_text: type="LOGIN_ERROR", realmName="example", clientId="security-admin-console", error="invalid_user_credentials"
