title: Google Workspace Admin Role Granted
id: 8d3f5c72-9a41-4b63-a7e8-2c3d4e5f6a7b
status: experimental
description: >
  A user was assigned an administrator role or granted an admin privilege.
  Privilege grant in the identity provider is the highest-leverage change anyone
  can make in the estate, because everything else federates from it.
references:
  - https://developers.google.com/admin-sdk/reports/v1/appendix/activity/admin
author: samma-io
level: critical
tags:
  - attack.privilege_escalation
logsource:
  product: workspace
  service: reports
detection:
  selection:
    source: workspace
    feed: admin
    name:
      - ASSIGN_ROLE
      - GRANT_ADMIN_PRIVILEGE
      - GRANT_DELEGATED_ADMIN_PRIVILEGES
  condition: selection
falsepositives:
  - A planned administrator onboarding.
