    - filesystem
    - host
    - mitre_persistence
    - T1098
    time: '2026-11-25T10:00:00.123456789Z'
    output: '10:00:00.123456789: Error File below /etc opened for writing (file=/etc/passwd pcmdline=sh -c echo user=root
      process=sh container_name=web k8s_ns=shop k8s_pod_name=web-0)'
    output_fields:
