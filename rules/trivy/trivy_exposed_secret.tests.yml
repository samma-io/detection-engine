# Events are k8s-log-router push.vrl (parse: trivy) output for trivy-operator reports, with names replaced.
- name: exposed key fires
  expected: true
  event:
    source: trivy
    feed: push
    kind: ExposedSecretReport
    report_name: replicaset-api-7f9d-api
    resource:
      kind: ReplicaSet
      name: api-7f9d
      namespace: shop
      container: api
    image: ghcr.io/example/api:2.1
    summary:
      criticalCount: 1
      highCount: 0
      mediumCount: 2
      lowCount: 4
      unknownCount: 0
    critical: true
    high: false
    secrets: 1
    findings:
    - id: aws-access-key-id
      severity: CRITICAL
      category: AWS
      title: AWS Access Key ID
      target: /app/.env
    event_time: '2026-11-25T10:00:00.123Z'
    search_text: '{"kind":"ExposedSecretReport","image":"ghcr.io/example/api:2.1"}'
- name: empty secret report does not fire
  expected: false
  event:
    source: trivy
    feed: push
    kind: ExposedSecretReport
    report_name: replicaset-api-7f9d-api
    resource:
      kind: ReplicaSet
      name: api-7f9d
      namespace: shop
      container: api
    image: ghcr.io/example/api:2.1
    summary:
      criticalCount: 0
      highCount: 0
      mediumCount: 2
      lowCount: 4
      unknownCount: 0
    critical: false
    high: false
    secrets: 0
    findings: []
    event_time: '2026-11-25T10:00:00.123Z'
    search_text: '{"kind":"ExposedSecretReport","image":"ghcr.io/example/api:2.1"}'
- name: vulnerability report does not fire
  expected: false
  event:
    source: trivy
    feed: push
    kind: VulnerabilityReport
    report_name: replicaset-api-7f9d-api
    resource:
      kind: ReplicaSet
      name: api-7f9d
      namespace: shop
      container: api
    image: ghcr.io/example/api:2.1
    summary:
      criticalCount: 1
      highCount: 0
      mediumCount: 2
      lowCount: 4
      unknownCount: 0
    critical: true
    high: false
    secrets: 0
    findings:
    - id: CVE-2026-1000
      severity: CRITICAL
      package: openssl
      installed: 3.0.1
      fixed: 3.0.9
      title: 'openssl: example'
    event_time: '2026-11-25T10:00:00.123Z'
    search_text: '{"kind":"VulnerabilityReport","image":"ghcr.io/example/api:2.1"}'
