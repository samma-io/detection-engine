title: Trivy Exposed Secret in Image
id: cbe43397-073f-42e0-9d53-a104a285d52c
status: experimental
description: trivy-operator found a secret (a cloud key, token or private key) baked into an image that runs in the cluster.
  findings names the rule and the file; the secret itself is not forwarded. Rotate the secret, then rebuild the image without
  it.
author: samma-io
level: high
tags:
- attack.credential_access
- attack.t1552.001
logsource:
  product: trivy
  service: reports
detection:
  selection:
    kind: ExposedSecretReport
  filter_none:
    secrets: 0
  condition: selection and not filter_none
falsepositives:
- Test fixtures or example keys shipped in an image.
