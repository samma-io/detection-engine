# Events modelled on real osquery-client rows (osquery 5.24.1), with hosts and users replaced.
- name: /etc/passwd updated fires
  expected: true
  event:
    source: osquery
    feed: result
    name: samma_file_events
    hostIdentifier: test-host
    unixTime: 1794343378
    epoch: 0
    counter: 3
    numerics: false
    action: added
    columns:
      path: /etc/passwd
      category: accounts
      action: UPDATED
      uid: '0'
      gid: '0'
      mode: '0644'
      size: '3021'
      time: '1794343378'
    event_time: '2026-11-10T20:42:58.000Z'
    search_text: samma_file_events added
    gateway_peer: 192.0.2.10
