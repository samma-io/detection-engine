# Events modelled on real osquery-client rows (osquery 5.24.1), with hosts and users replaced.
- name: samma_sudoers added after the baseline fires
  expected: true
  event:
    source: osquery
    feed: result
    name: samma_sudoers
    hostIdentifier: test-host
    unixTime: 1794343378
    epoch: 0
    counter: 3
    numerics: false
    action: added
    columns: &id001
      source: /etc/sudoers.d/90-test
      header: alice
      rule_details: 'ALL=(ALL) NOPASSWD: ALL'
    event_time: '2026-11-10T20:42:58.000Z'
    search_text: samma_sudoers added
    gateway_peer: 192.0.2.10
- name: samma_sudoers removed fires
  expected: true
