    source: osquery
    feed: result
    name: samma_users
    hostIdentifier: test-host
    unixTime: 1794343378
    epoch: 0
    counter: 3
    numerics: false
    action: removed
    columns: *id001
    event_time: '2026-11-10T20:42:58.000Z'
    search_text: samma_users removed
    gateway_peer: 192.0.2.10
