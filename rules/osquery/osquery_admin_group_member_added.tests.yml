  event:
    source: osquery
    feed: result
    name: samma_admin_group_members
    hostIdentifier: test-host
    unixTime: 1794343378
    epoch: 0
    counter: 3
    numerics: false
    action: added
    columns: &id001
      username: alice
      uid: '1000'
      groupname: docker
      gid: '989'
    event_time: '2026-11-10T20:42:58.000Z'
    search_text: samma_admin_group_members added
    gateway_peer: 192.0.2.10
