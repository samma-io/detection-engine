# Legacy records follow samma-io/nmap nmap_portscanner.py and its sammaParser.logger(): the scanner's
# record plus the samma-io block, with the lane's source field added.
- name: a TCP port listed by nmap fires
  expected: true
  event:
    type: nmap
    scanner: nmap_port
    target: www.example.com
    port: '443'
    protocol: tcp
    samma-io:
      scanner: nmap
      id: scanner-www-example-com
      target_id: ''
      scan_id: 5f0c8a52-3f7e-4f1b-9d3a-6f2b8e1c4a90
      tags:
      - scanner
      json: '{}'
    source: scanner
- name: a UDP port does not fire
  expected: false
  event:
    type: nmap
    scanner: nmap_port
    target: www.example.com
    port: '53'
    protocol: udp
    samma-io:
      scanner: nmap
      id: scanner-www-example-com
      target_id: ''
      scan_id: 5f0c8a52-3f7e-4f1b-9d3a-6f2b8e1c4a90
      tags:
      - scanner
      json: '{}'
    source: scanner
