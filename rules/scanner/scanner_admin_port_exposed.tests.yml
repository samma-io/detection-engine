# v2 events are built with samma-io/detect v2.0.2 common/samma_finding/schema.py
# (build_finding / build_run), with the lane's source field added.
- name: postgres reachable on a scanned target fires
  expected: true
  event:
    checkId: SAMMA-PORT-OPEN-ADMIN
    compliance: []
    cveIds: []
    emittedAt: '2026-10-24T02:00:21Z'
    endpoint:
      host: db.example.com
      port: 5432
      scheme: postgresql
    evidence: tcp/5432 open on 192.0.2.20 (ipv4); port is normally postgresql
    host: db.example.com
    kind: finding
    port: 5432
    raw:
      addresses:
      - address: 192.0.2.20
        family: ipv4
        status: open
      host: db.example.com
      port: 5432
      status: open
      type: PortScan
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html
    - https://www.cisecurity.org/controls/v8
    remediation: Close the port at the firewall or load balancer, or restrict it to trusted networks (VPN, bastion host, private peering). Management and database services should not be reachable from the public internet.
    runId: port-scanner-db-example-com-28934712-k9z2p
    samma-io:
      id: scanner-db-example-com
      json: '{}'
      scanner: port-scanner
      tags:
      - scanner
    scanner: port-scanner
    scannerVersion: 2.0.2
    schema: samma.io/scan/v2
    severity: HIGH
    source: scanner
    status: open
    target: db.example.com
    title: Administrative or database port is reachable from the internet
    type: PortScan
