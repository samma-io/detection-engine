title: Kubernetes ServiceAccount Created
id: a93db80d-639a-57a7-90f4-0a7b797ea370
status: experimental
description: >
  Detects creation of new service accounts which could be used for persistence
  or privilege escalation. Narrowed from the source rule to creates on the
  serviceaccounts collection, so a token request (serviceaccounts/token) is
  reported only by k8s_token_created. Ported from samma-io/siem-rules rule
  k8s-service-account-created.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_service_account_created.yaml
author: samma-io
level: medium
tags:
  - attack.t1136
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: serviceaccounts
    verb: create
    requestURI|re: /serviceaccounts(\?|$)
  condition: selection
falsepositives:
  - Normal application deployments.
