# Built from the audit.k8s.io/v1 Event the API server writes for an
# impersonated request: user is the impersonator, impersonatedUser the identity
# acted as, and verb, objectRef and requestURI are those of the request itself.
# The lane's source field is added. A refused impersonation is answered by the
# impersonation filter with a 403 before impersonatedUser is recorded.
- name: kubectl --as=system:admin get pods fires
  expected: true
  event:
    source: k8s
    kind: Event
    apiVersion: audit.k8s.io/v1
    level: Metadata
    auditID: 3f9d1c52-8a7e-4b0f-9c61-2d4e5a7b8c90
    stage: ResponseComplete
    requestURI: /api/v1/namespaces/default/pods?limit=500
    verb: list
    user:
      username: alice@example.com
      groups:
      - developers
      - system:authenticated
    impersonatedUser:
      username: system:admin
      groups:
      - system:authenticated
    sourceIPs:
    - 10.0.5.99
    userAgent: kubectl/v1.31.2 (linux/amd64) kubernetes/5864a46
    objectRef:
      resource: pods
      namespace: default
      apiVersion: v1
    responseStatus:
      metadata: {}
      code: 200
    requestReceivedTimestamp: '2026-02-11T03:00:00.000000Z'
    stageTimestamp: '2026-02-11T03:00:00.012000Z'
    annotations:
      authorization.k8s.io/decision: allow
      authorization.k8s.io/reason: 'RBAC: allowed by ClusterRoleBinding "admins" of ClusterRole "cluster-admin" to User "system:admin"'
