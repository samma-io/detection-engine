title: Kubernetes NodePort Service Created
id: 631fa06f-c644-58b0-b69d-d2f6c060c2f2
status: experimental
description: >
  Detects creation of NodePort services which expose cluster ports externally
  - potential unauthorized network exposure. Ported from samma-io/siem-rules
  rule k8s-nodeport-created.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_nodeport_created.yaml
author: samma-io
level: high
tags:
  - attack.t1133
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: services
    verb: create
    requestObject.spec.type: NodePort
  condition: selection
falsepositives:
  - Services that are meant to be exposed on the node network.
