title: Kubernetes Attach To Running Container
id: 0868fa4d-a6b5-53f1-b5dd-de1149f810b0
status: experimental
description: >
  Detects attaching to a running container - indicates interactive access for
  lateral movement. Ported from samma-io/siem-rules rule k8s-pod-attach.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_pod_attach.yaml
author: samma-io
level: high
tags:
  - attack.t1609
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: pods
    objectRef.subresource: attach
    # kubectl 1.30+ opens the stream with a websocket GET; older clients
    # (SPDY) POST it, audited as create.
    verb:
    - create
    - get
  condition: selection
falsepositives:
  - An operator debugging a container interactively.
