      resource: secrets
      namespace: kube-system
      apiVersion: v1
    responseStatus:
      metadata: {}
      code: 200
    requestReceivedTimestamp: '2026-02-11T02:00:00.000000Z'
    stageTimestamp: '2026-02-11T02:00:00.100000Z'
