# Positive case: samma-io/siem-rules test/k8s/k8s_privileged_pod.json, with the lane's
# source field added and auditID replaced. Negative cases flip the field the
# rule keys on.
- name: the siem-rules fixture fires
  expected: true
  event:
    source: k8s
    kind: Event
    apiVersion: audit.k8s.io/v1
    level: RequestResponse
    auditID: 0354ff85-d8df-5dab-940e-d20d6a6ea10f
    stage: ResponseComplete
    requestURI: /api/v1/namespaces/default/pods
    verb: create
    user:
      username: developer@example.com
      groups:
      - system:authenticated
    sourceIPs:
    - 10.0.1.50
    objectRef:
      resource: pods
      namespace: default
      name: debug-pod
      apiVersion: v1
    requestObject:
      kind: Pod
      apiVersion: v1
      metadata:
        name: debug-pod
        namespace: default
      spec:
        hostNetwork: true
        hostPID: true
        hostIPC: false
        containers:
        - name: debug
          image: ubuntu:latest
          securityContext:
            privileged: true
    responseStatus:
      metadata: {}
      code: 201
    requestReceivedTimestamp: '2026-02-11T00:30:00.000000Z'
    stageTimestamp: '2026-02-11T00:30:00.100000Z'
- name: a pod without host namespaces does not fire
  expected: false
  event:
    source: k8s
    kind: Event
    apiVersion: audit.k8s.io/v1
    level: RequestResponse
    auditID: 0354ff85-d8df-5dab-940e-d20d6a6ea10f
    stage: ResponseComplete
    requestURI: /api/v1/namespaces/default/pods
    verb: create
    user:
      username: developer@example.com
      groups:
      - system:authenticated
    sourceIPs:
    - 10.0.1.50
    objectRef:
      resource: pods
      namespace: default
      name: debug-pod
      apiVersion: v1
    requestObject:
      kind: Pod
      apiVersion: v1
      metadata:
        name: debug-pod
        namespace: default
      spec:
        hostNetwork: false
        hostPID: false
        hostIPC: false
        containers:
        - name: debug
          image: ubuntu:latest
          securityContext:
            privileged: true
    responseStatus:
      metadata: {}
      code: 201
    requestReceivedTimestamp: '2026-02-11T00:30:00.000000Z'
    stageTimestamp: '2026-02-11T00:30:00.100000Z'
