title: Kubernetes Secret Read
id: a44d32ae-e879-57ea-9cba-f513d69b3076
status: experimental
description: >
  Detects access to Kubernetes secrets (get/list) which may indicate
  credential harvesting. Ported from samma-io/siem-rules rule
  k8s-secret-accessed.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_secret_accessed.yaml
author: samma-io
level: high
tags:
  - attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: secrets
    verb:
    - get
    - list
    - watch
  # Controllers (Argo CD, cert-manager, operators) get named secrets all day.
  # A service account listing or watching secrets still fires: that is what
  # harvesting looks like.
  filter_service_account_get:
    verb: get
    user.username|startswith: 'system:serviceaccount:'
  # Controllers that list every secret on a schedule by design: Argo CD's
  # application controller (cluster cache) and the Ankra agent (inventory).
  # Each re-lists several times an hour, which would be hundreds of high
  # alerts a day. Only their list is skipped; a watch, or a list by any
  # other identity, still fires.
  filter_known_controller_list:
    verb: list
    user.username:
      - system:serviceaccount:argocd:argocd-application-controller
      - system:serviceaccount:ankra:ankra-agent-sa
  condition: selection and not filter_service_account_get and not filter_known_controller_list
falsepositives:
  - Controllers that list or watch secrets.
  - People reading a secret while debugging.
