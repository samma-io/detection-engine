title: Kubernetes Secret Read
id: a44d32ae-e879-57ea-9cba-f513d69b3076
status: experimental
description: >
  Detects access to Kubernetes secrets (get/list) which may indicate
  credential harvesting. Ported from samma-io/siem-rules rule
  k8s-secret-accessed.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_secret_accessed.yaml
author: samma-io
level: high
tags:
  - attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: secrets
    verb:
    - get
    - list
    - watch
  condition: selection
falsepositives:
  - Controllers and workloads that read their own secrets.
