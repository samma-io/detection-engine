title: Kubernetes Secret Created, Changed Or Deleted
id: 24c61686-b618-5917-a184-c53dd1196fa6
status: experimental
description: >
  Detects creation, update, or deletion of secrets - may indicate credential
  tampering or exfiltration setup. Ported from samma-io/siem-rules rule
  k8s-secret-modified.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_secret_modified.yaml
author: samma-io
level: high
tags:
  - attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: secrets
    verb:
    - create
    - update
    - patch
    - delete
  condition: selection
falsepositives:
  - Deployments, cert-manager renewals and secret operators.
