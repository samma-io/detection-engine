title: Kubernetes Ingress Created
id: b7804635-afef-5c26-9940-ca9c7ae99502
status: experimental
description: >
  Detects creation of Ingress resources which expose services externally.
  Ported from samma-io/siem-rules rule k8s-ingress-created.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_ingress_created.yaml
author: samma-io
level: medium
tags:
  - attack.t1133
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: ingresses
    verb: create
  condition: selection
falsepositives:
  - Normal application deployments.
