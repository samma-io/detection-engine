title: Kubernetes ServiceAccount Token Requested
id: 9d723255-9c22-5374-a9b4-97e995fbd4b4
status: experimental
description: >
  Detects service account token generation requests - may indicate credential
  theft or unauthorized access attempts. Ported from samma-io/siem-rules rule
  k8s-token-created.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_token_created.yaml
author: samma-io
level: high
tags:
  - attack.t1528
  - attack.t1078.004
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: serviceaccounts
    objectRef.subresource: token
    verb: create
  condition: selection
falsepositives:
  - The kubelet requesting projected tokens for pods.
