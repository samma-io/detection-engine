title: Kubernetes Port Forward To Pod
id: d76549f4-6bd1-5232-9147-52c368fb03a0
status: experimental
description: >
  Detects port forwarding to pods - may indicate protocol tunneling or
  unauthorized access to internal services. Ported from samma-io/siem-rules
  rule k8s-port-forward.
references:
  - https://github.com/samma-io/siem-rules/blob/main/rules/k8s/k8s_port_forward.yaml
author: samma-io
level: high
tags:
  - attack.t1572
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kind: Event
    objectRef.resource: pods
    objectRef.subresource: portforward
    # kubectl 1.30+ opens the stream with a websocket GET; older clients
    # (SPDY) POST it, audited as create.
    verb:
    - create
    - get
  condition: selection
falsepositives:
  - Developers reaching a service through kubectl port-forward.
