# Positive case: samma-io/siem-rules test/k8s/k8s_service_account_created.json, with the lane's
# source field added and auditID replaced. Negative cases flip the field the
# rule keys on.
- name: the siem-rules fixture fires
  expected: true
  event:
    source: k8s
    kind: Event
    apiVersion: audit.k8s.io/v1
    level: RequestResponse
    auditID: 07261770-2638-5cd9-bbf0-066d98d6a0db
    stage: ResponseComplete
    requestURI: /api/v1/namespaces/default/serviceaccounts
    verb: create
    user:
      username: admin@example.com
      groups:
      - system:masters
      - system:authenticated
    sourceIPs:
    - 10.0.1.10
    objectRef:
      resource: serviceaccounts
      namespace: default
      name: my-service-account
      apiVersion: v1
    responseStatus:
      metadata: {}
      code: 201
    requestReceivedTimestamp: '2026-02-10T17:00:00.000000Z'
    stageTimestamp: '2026-02-10T17:00:00.100000Z'
