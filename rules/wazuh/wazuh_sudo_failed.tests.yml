# Wazuh rule ids from the ruleset of the deployed 4.14.0 manager; events
# modelled on real alerts from the v2 test agent, with names and hosts replaced.
- name: wazuh rule 5405 fires
  expected: true
  event:
    source: wazuh
    feed: alerts
    id: '1794135635.33743'
    timestamp: 2026-11-08T11:00:35.792+0000
    event_time: '2026-11-08T11:00:35.792Z'
    rule:
      id: '5405'
      level: 5
      description: Unauthorized user attempted to use sudo.
      groups:
      - syslog
      - sudo
      firedtimes: 1
      mail: false
    agent:
      id: '001'
      name: test-agent
    manager:
      name: wazuh-manager-worker-0-0
    location: /hostfs/var/log/auth.log
    full_log: 'base sudo: bob : user NOT in sudoers ; TTY=pts/1 ; PWD=/home/bob ; USER=root ; COMMAND=/bin/bash'
    search_text: 'base sudo: bob : user NOT in sudoers ; TTY=pts/1 ; PWD=/home/bob ; USER=root ; COMMAND=/bin/bash'
    data:
      srcuser: bob
      dstuser: root
      command: /bin/bash
