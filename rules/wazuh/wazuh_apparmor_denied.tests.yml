# Wazuh rule ids from the ruleset of the deployed 4.14.0 manager; events
# modelled on real alerts from the v2 test agent, with names and hosts replaced.
- name: wazuh rule 52002 fires
  expected: true
  event:
    source: wazuh
    feed: alerts
    id: '1794135635.33743'
    timestamp: 2026-11-08T11:00:35.792+0000
    event_time: '2026-11-08T11:00:35.792Z'
    rule:
      id: '52002'
      level: 3
      description: Apparmor DENIED
      groups:
      - local
      - syslog
      - apparmor
      firedtimes: 1
      mail: false
    agent:
      id: '001'
      name: test-agent
    manager:
      name: wazuh-manager-worker-0-0
    location: /hostfs/var/log/syslog
    full_log: 'base kernel: audit: type=1400 audit(1794135634.544:444): apparmor="DENIED" operation="open" class="file" profile="snap.example.app" name="/proc/1/mounts"'
    search_text: 'base kernel: audit: type=1400 audit(1794135634.544:444): apparmor="DENIED" operation="open" class="file" profile="snap.example.app" name="/proc/1/mounts"'
    data:
      status: DENIED
      extra_data: open
