- name: a successful login does not fire
  expected: false
  event:
    source: wazuh
    feed: alerts
    id: '1794135635.33743'
    timestamp: 2026-11-08T11:00:35.792+0000
    event_time: '2026-11-08T11:00:35.792Z'
    rule:
      id: '5501'
      level: 3
      description: 'PAM: Login session opened.'
      groups:
      - pam
      - syslog
      - authentication_success
      firedtimes: 1
      mail: false
    agent:
      id: '001'
      name: test-agent
    manager:
      name: wazuh-manager-worker-0-0
    location: /hostfs/var/log/auth.log
    full_log: 'base sudo: pam_unix(sudo:session): session opened for user root(uid=0) by alice(uid=1000)'
    search_text: 'base sudo: pam_unix(sudo:session): session opened for user root(uid=0) by alice(uid=1000)'
    data:
      dstuser: root
