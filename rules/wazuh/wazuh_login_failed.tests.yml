    feed: alerts
    id: '1794135635.33743'
    timestamp: 2026-11-08T11:00:35.792+0000
    event_time: '2026-11-08T11:00:35.792Z'
    rule:
      id: '5716'
      level: 5
      description: 'sshd: authentication failed.'
      groups:
      - syslog
      - sshd
      - authentication_failed
      firedtimes: 1
      mail: false
    agent:
      id: '001'
      name: test-agent
    manager:
      name: wazuh-manager-worker-0-0
    location: /hostfs/var/log/auth.log
    full_log: 'base sshd[4242]: Failed password for alice from 192.0.2.10 port 50022 ssh2'
    search_text: 'base sshd[4242]: Failed password for alice from 192.0.2.10 port 50022 ssh2'
