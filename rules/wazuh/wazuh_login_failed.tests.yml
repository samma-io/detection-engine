# Wazuh rule ids from the ruleset of the deployed 4.14.0 manager; events
# modelled on real alerts from the v2 test agent, with names and hosts replaced.
- name: wazuh rule 5503 fires
  expected: true
  event:
    source: wazuh
    feed: alerts
    id: '1794135635.33743'
    timestamp: 2026-11-08T11:00:35.792+0000
    event_time: '2026-11-08T11:00:35.792Z'
    rule:
      id: '5503'
      level: 5
      description: 'PAM: User login failed.'
      groups:
      - pam
      - syslog
      - authentication_failed
      firedtimes: 1
      mail: false
    agent:
      id: '001'
      name: test-agent
    manager:
      name: wazuh-manager-worker-0-0
    location: /hostfs/var/log/auth.log
    full_log: 'base i3lock: pam_unix(i3lock:auth): authentication failure; logname=alice uid=1000 euid=1000 tty=:0 ruser= rhost=  user=alice'
    search_text: 'base i3lock: pam_unix(i3lock:auth): authentication failure; logname=alice uid=1000 euid=1000 tty=:0 ruser= rhost=  user=alice'
    data:
      dstuser: alice
      uid: '1000'
- name: wazuh rule 5716 fires
