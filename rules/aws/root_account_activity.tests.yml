# This case is the reason the sidecar exists: userIdentity.type is a nested
# path, and without the engine's flattened match view it would never match.
- name: root console login fires
  expected: true
  event:
    source: aws
    eventName: ConsoleLogin
    eventSource: signin.amazonaws.com
    userIdentity:
      type: Root
      arn: arn:aws:iam::123456789012:root
      accountId: "123456789012"
    sourceIPAddress: 198.51.100.9

- name: root API call fires
  expected: true
  event:
    source: aws
    eventName: CreateUser
    userIdentity: {type: Root}

- name: an assumed role does not fire
  expected: false
  event:
    source: aws
    eventName: ConsoleLogin
    userIdentity:
      type: AssumedRole
      arn: arn:aws:sts::123456789012:assumed-role/engineer/alice

- name: a root service event does not fire
  expected: false
  event:
    source: aws
    eventType: AwsServiceEvent
    eventName: ServiceHousekeeping
    userIdentity: {type: Root}
