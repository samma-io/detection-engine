title: AWS Root Account Used
id: 2c9e5f81-4b7a-4d62-8e13-9a0b1c2d3e4f
status: stable
description: >
  The root account performed an API call. Root should be used for nothing
  except the handful of tasks that require it, so any activity is worth a
  look, and console logins especially.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
author: samma-io
level: high
tags:
  - attack.privilege_escalation
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.type: Root
  # Root's own service-linked housekeeping is not interesting and would
  # otherwise fire on every account.
  filter_service_events:
    eventType: AwsServiceEvent
  condition: selection and not filter_service_events
falsepositives:
  - Account setup and billing tasks that genuinely require root.
