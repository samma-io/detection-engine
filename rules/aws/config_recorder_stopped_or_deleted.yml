title: AWS Config Recording Stopped Or Deleted
id: 7e3d90b5-2c41-4a86-9f07-8b1a2c3d4e56
status: experimental
description: >
  AWS Config recording was stopped, or a recorder or delivery channel was
  deleted. Config is the record of what the estate looked like and when it
  changed, so switching it off removes the evidence trail for everything that
  follows rather than any single action. It is a standard early step once an
  attacker has administrative access.
  Security Hub control CloudWatch.9 (CIS AWS Foundations 3.9 / 4.9).
references:
  - https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-9
author: samma-io
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: config.amazonaws.com
    eventName:
      - StopConfigurationRecorder
      - DeleteConfigurationRecorder
      - DeleteDeliveryChannel
      - PutConfigurationRecorder
      - PutDeliveryChannel
  filter_failed:
    errorCode|startswith: AccessDenied
  condition: selection and not filter_failed
falsepositives:
  - Terraform reconciling the Config recorder. PutConfigurationRecorder and
    PutDeliveryChannel are included because a recorder reconfigured to record
    nothing is equivalent to one stopped, and that is not visible from the
    event name alone -- expect these two to be the chatty half of this rule.
