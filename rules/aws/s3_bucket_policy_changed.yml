title: AWS S3 Bucket Policy Or ACL Changed
id: 0c6d2f89-4b17-4e35-a8c9-3d5e6f7a8b90
status: experimental
description: >
  A bucket policy, ACL or CORS configuration was written or deleted. These are
  the controls that decide who can read a bucket, and this estate's buckets
  hold claims and log data, so a change here is a change to the blast radius of
  everything stored in them.
  Security Hub control CloudWatch.8 (CIS 3.8 / 4.8). Complements
  s3_public_access_block_removed, which covers the account and bucket level
  public-access block rather than the policy itself.
references:
  - https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-8
author: samma-io
level: medium
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName:
      - PutBucketPolicy
      - DeleteBucketPolicy
      - PutBucketAcl
      - PutBucketCors
      - DeleteBucketCors
  filter_failed:
    errorCode|startswith: AccessDenied
  condition: selection and not filter_failed
falsepositives:
  - Terraform applying bucket policy as code.
  - Log delivery services writing their own bucket policy on setup.
