- name: CreateCustomerGateway fires
  expected: true
  event:
    source: aws
    eventSource: ec2.amazonaws.com
    eventName: CreateCustomerGateway
    recipientAccountId: '123456789012'

- name: a denied attempt does not fire
  expected: false
  event:
    source: aws
    eventSource: ec2.amazonaws.com
    eventName: CreateCustomerGateway
    errorCode: AccessDeniedException

- name: an unrelated ec2 read does not fire
  expected: false
  event:
    source: aws
    eventSource: ec2.amazonaws.com
    eventName: DescribeInstances
