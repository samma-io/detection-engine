    feed: k8s
    ClientHost: 198.51.100.7
    ClientPort: '51544'
    RequestHost: app.example.com
    RequestMethod: GET
    RequestPath: /assets/app.v1.2.min.js
    RequestProtocol: HTTP/1.1
