- name: creating a service account key fires
  expected: true
  event:
    source: gcp
    feed: activity
    actor_email: example.person@example.com
    event_time: '2026-09-03T10:00:00Z'
    protoPayload:
      methodName: google.iam.admin.v1.CreateServiceAccountKey
      authenticationInfo:
        principalEmail: example.person@example.com

- name: listing keys does not fire
  expected: false
  event:
    source: gcp
    feed: activity
    protoPayload:
      methodName: google.iam.admin.v1.ListServiceAccountKeys

- name: deleting a key does not fire on this rule
  expected: false
  event:
    source: gcp
    feed: activity
    protoPayload:
      methodName: google.iam.admin.v1.DeleteServiceAccountKey
