title: GCP Service Account Key Created
id: 1e6a8b93-4c25-4d78-9f01-5a6b7c8d9e0f
status: experimental
description: >
  A user-managed service account key was created. These are long-lived
  credentials that leave the perimeter in files and rarely get rotated, which is
  why Google's own guidance is to avoid them entirely in favour of workload
  identity federation.
references:
  - https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
author: samma-io
level: high
tags:
  - attack.persistence
  - attack.credential_access
logsource:
  product: gcp
  service: audit
detection:
  selection:
    source: gcp
    protoPayload.methodName: google.iam.admin.v1.CreateServiceAccountKey
  condition: selection
falsepositives:
  - A documented break-glass credential.
