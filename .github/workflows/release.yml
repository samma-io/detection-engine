name: release

on:
  push:
    tags: ['v*']

jobs:
  image:
    name: ghcr.io/samma-io/detection-engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/samma-io/detection-engine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  rules:
    name: rules tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: rulecheck gate
        run: go test -run 'TestRules_' ./internal/rulecheck/
      - name: package
        run: ./hack/package-rules.sh "${GITHUB_REF_NAME}" dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rules-${{ github.ref_name }}.tar.gz
            dist/rules-${{ github.ref_name }}.tar.gz.sha256
